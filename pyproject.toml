[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualpd"
version = "0.1.0"
description = "Agentic inference serving and reproducible PD-disaggregation benchmarks"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.12,<4", "httpx[http2]>=0.28,<0.29", "numpy>=2,<3",
  "transformers>=4.51", "PyYAML>=6,<7", "jinja2>=3.1,<4",
  "prometheus-client>=0.20,<1", "psutil>=5.9,<8", "orjson>=3.10",
  "fastapi>=0.115", "uvicorn>=0.30", "pyarrow>=19", "datasets>=3", "pillow",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.9", "pandas>=2", "scipy>=1.13"]
swe = ["docker>=7", "swebench==4.0.3"]

[project.scripts]
dualpd = "dualpd.runtime.cli:main"

[tool.setuptools]
packages = ["dualpd", "dualpd.runtime", "dualpd.runtime.workloads", "dualpd.data",
            "dualpd.runtime.launch", "dualpd.runtime.launch.local",
            "dualpd.runtime.launch.baseline", "dualpd.runtime.launch.cluster",
            "dualpd.runtime.analysis", "dualpd.runtime.observation",
            "dualpd.data.browsecomp", "dualpd.data.swe_bench_verified",
            "dualpd.data.swe_bench_verified.images"]
package-dir = {dualpd = "."}
include-package-data = false

[tool.setuptools.package-data]
dualpd = ["configs/**/*.yaml", "configs/**/*.json", "configs/**/*.yml",
          "configs/environment/*.txt", "scripts/**/*.sh", "runtime/**/*.sh",
          "runtime/observation/host_pools/*.py", "data/**/*.j2", "data/**/*.yaml"]
