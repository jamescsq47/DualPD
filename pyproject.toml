[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualpd"
version = "0.1.0"
description = "Agentic inference serving and reproducible PD-disaggregation benchmarks"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.12,<4", "httpx[http2]>=0.28,<0.29", "numpy>=2,<3",
  "transformers>=4.51", "PyYAML>=6,<7", "jinja2>=3.1,<4",
  "prometheus-client>=0.20,<1", "psutil>=5.9,<8", "orjson>=3.10",
  "fastapi>=0.115", "uvicorn>=0.30", "pyarrow>=19", "datasets>=3",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
analysis = ["matplotlib>=3.9", "pandas>=2", "scipy>=1.13"]
swe = ["docker>=7", "swebench", "mini-swe-agent==2.4.6"]

[project.scripts]
dualpd = "dualpd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dualpd = ["configs/**/*", "scripts/**/*", "docs/*.md", "data/**/*.yaml", "data/**/*.json", "data/**/*.txt", "data/**/*.j2", "requirements*.txt", "requirement.txt"]

[tool.pytest.ini_options]
testpaths = [
  "tests/test_standalone.py",
  "src/dualpd/tests/test_agentic_kv_request.py",
  "src/dualpd/tests/test_late_binding_router.py",
  "src/dualpd/tests/test_workload_plugins.py",
  "src/dualpd/tests/test_swe_bench_openenv_harness.py",
  "src/dualpd/tests/test_swe_bench_harness.py",
  "src/dualpd/tests/test_model_http_transport.py",
  "tools/dualpd/test_multinode.py", "tools/dualpd/test_global_pd_router.py",
  "tools/dualpd/test_process_supervisor.py", "tools/dualpd/test_qwen35_slurm.py",
  "tools/dualpd/test_qwen35_native_pd_slurm.py", "tools/dualpd/test_qwen35_colocated_slurm.py",
]
pythonpath = ["src", "src/dualpd", "tools/dualpd", "."]
