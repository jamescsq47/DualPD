schema_version: 1

datasets:
  - id: gaia
    harness: gaia_text
    path: /orcd/scratch/orcd/003/shangy/dualpd/datasets/gaia-text-103.jsonl
    weight: 1
    options:
      search_backend: auto
      tool_timeout_seconds: 20
      max_tool_errors: 8
      page_max_chars: 16000
      max_turns: 16
      max_tokens_per_turn: 8192
      max_response_tokens: 32768

sampling:
  policy: random
  seed: 2026
  preserve_source_order: true
  shuffle_algorithm: source_order
  count_algorithm: largest_remainder_v1
  pool_reuse_algorithm: cycle_as_needed_v1
